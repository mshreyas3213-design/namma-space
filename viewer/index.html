<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Namma Space</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #111; font-family: system-ui, sans-serif; color: #fff; }
  canvas { display: block; touch-action: none; }
  #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #111; z-index: 10; transition: opacity .4s; }
  #loading.done { opacity: 0; pointer-events: none; }
  .bar { width: 240px; height: 6px; background: #333; border-radius: 3px; overflow: hidden; margin-top: 14px; }
  .bar i { display: block; height: 100%; width: 40%; background: #4fc3f7; animation: slide 1.1s infinite ease-in-out; }
  @keyframes slide { 0% { margin-left: -40%; } 100% { margin-left: 100%; } }
  #help { position: fixed; left: 12px; bottom: 12px; padding: 10px 14px; background: rgba(0,0,0,.55); border-radius: 8px; font-size: 13px; line-height: 1.6; z-index: 5; }
  #help.hide { display: none; }
  .stick { position: fixed; bottom: 30px; width: 120px; height: 120px; border-radius: 50%; background: rgba(255,255,255,.12); border: 2px solid rgba(255,255,255,.3); display: none; z-index: 6; touch-action: none; }
  .stick b { position: absolute; width: 50px; height: 50px; border-radius: 50%; background: rgba(255,255,255,.45); left: 35px; top: 35px; }
  #sl { left: 24px; } #sr { right: 24px; }
  @media (pointer: coarse) { .stick { display: block; } #help { display: none; } }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "@sparkjsdev/spark": "https://sparkjs.dev/releases/spark/2.1.0/spark.module.js"
  }
}
</script>
</head>
<body>
<div id="loading"><div>Loading your space…</div><div class="bar"><i></i></div></div>
<div id="help">
  <b>Namma Space</b><br>
  W A S D: move &nbsp; Shift: faster<br>
  Drag mouse: look &nbsp; Q / E: down / up<br>
  F: flip model upside-down &nbsp; H: hide this
</div>
<div class="stick" id="sl"><b></b></div>
<div class="stick" id="sr"><b></b></div>

<script type="module">
import * as THREE from "three";
import { SparkRenderer, SplatMesh } from "@sparkjsdev/spark";

// Which splat to load. Default: ./assets/room1.spz
// Test with any file: index.html?splat=https://sparkjs.dev/assets/splats/butterfly.spz
const params = new URLSearchParams(location.search);
const SPLAT_URL = params.get("splat") || "./assets/room1.spz";

const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.05, 500);
camera.position.set(0, 0, 0);
camera.rotation.order = "YXZ";

const spark = new SparkRenderer({ renderer });
scene.add(spark);

// Nerfstudio/COLMAP output is usually upside-down in Three.js; F toggles the flip.
let flipped = true;
const splat = new SplatMesh({ url: SPLAT_URL });
splat.quaternion.set(1, 0, 0, 0);
scene.add(splat);

const loading = document.getElementById("loading");
splat.initialized
  .then(() => loading.classList.add("done"))
  .catch(err => { loading.innerHTML = "<div>Could not load the splat file.<br><small>" + SPLAT_URL + "</small></div>"; console.error(err); });

// ---- Controls ----
const keys = {};
let yaw = 0, pitch = 0;
addEventListener("keydown", e => {
  keys[e.code] = true;
  if (e.code === "KeyH") document.getElementById("help").classList.toggle("hide");
  if (e.code === "KeyF") { flipped = !flipped; splat.quaternion.set(flipped ? 1 : 0, 0, 0, flipped ? 0 : 1); }
});
addEventListener("keyup", e => keys[e.code] = false);

let dragging = false, lx = 0, ly = 0;
renderer.domElement.addEventListener("pointerdown", e => { if (e.pointerType === "mouse") { dragging = true; lx = e.clientX; ly = e.clientY; } });
addEventListener("pointerup", () => dragging = false);
addEventListener("pointermove", e => {
  if (!dragging) return;
  yaw -= (e.clientX - lx) * 0.004;
  pitch -= (e.clientY - ly) * 0.004;
  pitch = Math.max(-1.5, Math.min(1.5, pitch));
  lx = e.clientX; ly = e.clientY;
});

// Touch sticks: left = move, right = look
function makeStick(id) {
  const el = document.getElementById(id), knob = el.firstElementChild;
  const s = { x: 0, y: 0, id: null };
  const upd = e => {
    const r = el.getBoundingClientRect();
    let dx = (e.clientX - (r.left + r.width / 2)) / 50, dy = (e.clientY - (r.top + r.height / 2)) / 50;
    const m = Math.hypot(dx, dy); if (m > 1) { dx /= m; dy /= m; }
    s.x = dx; s.y = dy;
    knob.style.transform = `translate(${dx * 40}px, ${dy * 40}px)`;
  };
  el.addEventListener("pointerdown", e => { s.id = e.pointerId; el.setPointerCapture(e.pointerId); upd(e); });
  el.addEventListener("pointermove", e => { if (e.pointerId === s.id) upd(e); });
  const end = e => { if (e.pointerId === s.id) { s.x = s.y = 0; s.id = null; knob.style.transform = ""; } };
  el.addEventListener("pointerup", end); el.addEventListener("pointercancel", end);
  return s;
}
const stickL = makeStick("sl"), stickR = makeStick("sr");

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ---- Loop ----
const clock = new THREE.Clock();
const fwd = new THREE.Vector3(), right = new THREE.Vector3();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.1);
  const speed = (keys.ShiftLeft || keys.ShiftRight ? 3.0 : 1.2) * dt;

  yaw -= stickR.x * 2.0 * dt;
  pitch = Math.max(-1.5, Math.min(1.5, pitch - stickR.y * 1.5 * dt));
  camera.rotation.set(pitch, yaw, 0);

  // Walk on the horizontal plane (ignore pitch) so looking down doesn't sink you
  fwd.set(-Math.sin(yaw), 0, -Math.cos(yaw));
  right.set(Math.cos(yaw), 0, -Math.sin(yaw));
  let f = (keys.KeyW ? 1 : 0) - (keys.KeyS ? 1 : 0) - stickL.y;
  let r = (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0) + stickL.x;
  let u = (keys.KeyE ? 1 : 0) - (keys.KeyQ ? 1 : 0);
  camera.position.addScaledVector(fwd, f * speed);
  camera.position.addScaledVector(right, r * speed);
  camera.position.y += u * speed;

  renderer.render(scene, camera);
});
</script>
</body>
</html>
